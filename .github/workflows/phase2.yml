name: Phase 2 - get nix source code

on:
  workflow_call:

jobs:
  discovery:
    runs-on: windows-11-vs2026-arm
    steps:
      - uses: actions/checkout@v7

      - name: meson
        shell: pwsh
        run: |
          python -m pip install meson
          meson --version

      - name: ninja
        shell: pwsh
        run: |
          ninja --version

      # https://hydra.nixos.org/build/353483367/download/1/manual/installation/building-source.html
      - name: Get nix source code
        shell: bash
        run: |
          git clone -b 0.1 https://github.com/NixOS/nix.git
          ls -lR nix
          bash -c "autoconf --version && automake --version && libtool --version"
